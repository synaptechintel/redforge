name: macOS App and DMG Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/windows-exe-release
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'sidecar/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/macos-release.yml'

jobs:
  build-macos:
    name: Build RedForge macOS DMG
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build macOS app and DMG
        shell: bash
        run: bash ./scripts/build-macos.sh

      - name: Collect macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/
          ditto -c -k --keepParent src-tauri/target/release/bundle/macos/RedForge.app artifacts/RedForge.app.zip
          ls -lh artifacts

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RedForge-macOS-App-DMG
          path: |
            artifacts/*.dmg
            artifacts/*.zip
          if-no-files-found: error
