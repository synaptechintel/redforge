name: Release

# Triggers when you push a `vX.Y.Z` tag.
# Builds the full Windows release pipeline + smoke test + attaches
# installers to the GitHub Release as downloadable assets.
#
# To cut a release:
#   git tag v0.5.3
#   git push origin v0.5.3

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.5.3)"
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('sidecar/requirements.txt') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Install sidecar dependencies
        working-directory: sidecar
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt
          .venv\Scripts\python.exe -m pip install pyinstaller

      - name: Download MITRE ATT&CK data
        run: python scripts\download-attack-data.py

      - name: Build sidecar exe
        working-directory: sidecar
        run: .venv\Scripts\python.exe -m PyInstaller redforge-sidecar.spec --clean --noconfirm

      - name: Smoke test sidecar
        shell: pwsh
        run: |
          .\scripts\smoke-test.ps1 -ExePath "$pwd\sidecar\dist\redforge-sidecar.exe"
          if ($LASTEXITCODE -ne 0) { throw "Smoke tests failed - aborting release" }

      - name: Generate icons
        run: python scripts\generate-icons.py

      - name: Stage sidecar for Tauri
        run: copy sidecar\dist\redforge-sidecar.exe src-tauri\binaries\redforge-sidecar-x86_64-pc-windows-msvc.exe /Y

      - name: Build Tauri installer (signed for updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Generate updater manifest (latest.json)
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag -replace "^v", ""
          $setupExe = Get-ChildItem "src-tauri\target\release\bundle\nsis\RedForge_${version}_x64-setup.exe"
          $sigFile = "$($setupExe.FullName).sig"
          $signature = if (Test-Path $sigFile) { Get-Content $sigFile -Raw } else { "" }
          $manifest = @{
            version = $version
            notes = "See https://github.com/synaptechintel/redforge/releases/tag/$tag for the full release notes."
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ" -AsUTC)
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature.Trim()
                url = "https://github.com/synaptechintel/redforge/releases/download/$tag/RedForge_${version}_x64-setup.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -FilePath "latest.json" -Encoding utf8
          Get-Content "latest.json"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          .\scripts\package-portable.ps1

      - name: List artifacts
        shell: pwsh
        run: |
          Get-ChildItem src-tauri\target\release\bundle -Recurse -Include "*.exe","*.msi" | Format-Table FullName, @{N='MB';E={"{0:N1}" -f ($_.Length/1MB)}}
          Get-ChildItem RedForge_*_x64-portable.zip | Format-Table FullName, @{N='MB';E={"{0:N1}" -f ($_.Length/1MB)}}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: RedForge ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/RedForge_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/RedForge_*_x64-setup.exe.sig
            src-tauri/target/release/bundle/msi/RedForge_*_x64_en-US.msi
            RedForge_*_x64-portable.zip
            latest.json
