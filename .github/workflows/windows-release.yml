name: Windows EXE Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/windows-exe-release
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'sidecar/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-windows.ps1'
      - '.github/workflows/windows-release.yml'

jobs:
  build-windows:
    name: Build RedForge Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: sidecar/requirements.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Python sidecar executable
        shell: pwsh
        run: |
          cd sidecar
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller redforge-sidecar.spec --clean --noconfirm
          if (!(Test-Path "dist/redforge-sidecar/redforge-sidecar.exe")) { throw "sidecar exe missing" }
          cd ..
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Copy-Item "sidecar/dist/redforge-sidecar/redforge-sidecar.exe" "src-tauri/binaries/redforge-sidecar-x86_64-pc-windows-msvc.exe" -Force

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Windows app
        run: npm run tauri build -- --bundles nsis

      - name: Collect build outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem "src-tauri/target/release" -Filter "*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination artifacts -Force
          Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination artifacts -Force
          Get-ChildItem artifacts | Format-Table Name,Length
          if (-not (Get-ChildItem artifacts -Filter "*.exe" -ErrorAction SilentlyContinue)) { throw "No EXE artifacts produced" }

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RedForge-Windows-EXE
          path: artifacts/*.exe
          if-no-files-found: error
