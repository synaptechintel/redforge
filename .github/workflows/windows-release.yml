name: Windows EXE Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/windows-exe-release
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'sidecar/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/windows-release.yml'

jobs:
  build-windows:
    name: Build RedForge Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Windows EXE and NSIS installer
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Collect build outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "src-tauri/target/release/redforge.exe" "artifacts/RedForge-portable.exe" -Force
          Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction Stop | Copy-Item -Destination artifacts -Force
          Get-ChildItem artifacts | Format-Table Name,Length
          if (-not (Get-ChildItem artifacts -Filter "*.exe" -ErrorAction SilentlyContinue)) { throw "No EXE artifacts produced" }

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RedForge-Windows-EXE
          path: artifacts/*.exe
          if-no-files-found: error
